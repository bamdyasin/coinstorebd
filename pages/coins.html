<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Coin Top-Up - COINSTORE.BD</title>
    <meta name="description" content="টিকটক কয়েন কিনুন সবচেয়ে কম দামে। দ্রুত ডেলিভারি এবং নিরাপদ পেমেন্ট। TikTok Coins Recharge Bangladesh.">
    
    <!-- Bootstrap -->
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font -->
    <link href="../assets/css/css2" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<!-- Main content will be similar to index.html but focused on Coins -->
<div class="container mt-4 mb-5">
    <div class="row g-4">
        <div class="col-lg-3 sidebar-col">
            <div class="app-card p-3 shadow">
                <h5 class="fw-bold mb-3 px-2 text-gold"><i class="bi bi-shop me-2"></i> Shop Menu</h5>
                <a href="../home.html" class="sidebar-link"><i class="bi bi-grid-fill"></i> All Services</a>
                <a href="coins.html" class="sidebar-link active"><i class="bi bi-tiktok"></i> TikTok Top-Up</a>
            </div>
        </div>

        <div class="col-lg-9">
            <div class="app-card shadow-lg">
                <div class="hero-section text-center mb-4">
                    <h1 class="hero-slogan">TikTok <span style="color: #fe2c55;">কয়েন নিন</span></h1>
                    <p class="text-white-50">ইনস্ট্যান্ট ডেলিভারি এবং সবচেয়ে কম রেট</p>
                </div>

                <form action="#" method="POST" onsubmit="return validateTikTokForm()">
                    <input type="hidden" name="service_type" id="service_type_input" value="Coin">
                    
                    <div class="mb-4">
                        <label class="form-label text-white-50 small">কয়েনের পরিমাণ</label>
                        <div class="budget-counter">
                            <button type="button" class="counter-btn" onclick="updateCoins(-10)">−</button>
                            <input type="number" class="budget-input" name="coin_amount" id="coin_val" value="50" min="50" step="10">
                            <button type="button" class="counter-btn" onclick="updateCoins(10)">+</button>
                        </div>
                        <div id="coin_price_info" class="form-text text-white-50 small mt-2">
                            <i class="bi bi-info-circle me-1"></i> ১টি কয়েন = ২ টাকা (সর্বনিম্ন ৫০টি)
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-white-50 small">আপনার হোয়াটসঅ্যাপ নম্বর</label>
                        <input type="text" class="form-control" name="whatsapp" placeholder="017XXXXXXXX" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label text-white-50 small">পেমেন্ট মাধ্যম</label>
                            <select class="form-select" name="payment_method" id="payment_method" required onchange="updatePaymentInfo()">
                                <option value="" selected disabled>পছন্দ করুন</option>
                            </select>
                            <div id="payment_info_box" class="mt-3 p-3 rounded-3 d-none" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="small text-white-50" id="method_display">bKash</span>
                                    <span class="badge bg-primary px-2 py-1" style="font-size: 0.65rem;" id="account_type">Personal</span>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold fs-5 text-white" id="payment_number">017XXXXXXXX</span>
                                    <button type="button" class="btn btn-sm btn-link text-tiktok-sm p-0 text-decoration-none" onclick="copyNumber()">
                                        <i class="bi bi-copy me-1"></i> Copy
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label text-white-50 small">ট্রানজেকশন আইডি (TrxID)</label>
                            <input type="text" class="form-control" name="trxid" placeholder="8N72KL9X" required>
                        </div>
                    </div>

                    <button type="submit" id="submit_order_btn" class="btn btn-tiktok w-100 fs-5">
                        অর্ডার কনফার্ম করুন <i class="bi bi-arrow-right-circle ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/script.js"></script>
<script src="../assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
